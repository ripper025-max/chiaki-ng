name: Build RemotePlay Native RTX Windows

on:
  push:
    branches: [remoteplay-native-rtx]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win_x64:
    name: Build chiaki-ng win_x64 (VC)
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      vcpkg_baseline: 42bb0d9e8d4cf33485afb9ee2229150f79f61a1f
      dep_folder: deps
      libplacebo_tag: v7.387.0
      sdl2_compat_tag: 2.32.74

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $ver = (Invoke-RestMethod -Uri 'https://vulkan.lunarg.com/sdk/latest.json' -MaximumRetryCount 3 -RetryIntervalSec 5).windows
          if ($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Unexpected Vulkan SDK version: $ver" }
          Write-Host "Vulkan SDK version: $ver"
          $installer = Join-Path $PWD 'VulkanSDK.exe'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
          $proc = Start-Process -FilePath $installer -ArgumentList @('--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Vulkan installer failed: $($proc.ExitCode)" }
          if (-not (Test-Path 'C:\VulkanSDK\Include\vulkan\vulkan.h')) { throw 'Vulkan SDK header missing after install' }

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: win64_msvc2022_64
          cache: true
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile ".\ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Expand-Archive -LiteralPath "ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n9.0-latest-win64-gpl-shared-9.0" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc from official SDK or pinned source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:VULKAN_SDK
          $deps = Join-Path $PWD $env:dep_folder
          if ((Test-Path "$sdk/Lib/shaderc_shared.lib") -and (Test-Path "$sdk/Bin/shaderc_shared.dll") -and (Test-Path "$sdk/Include/shaderc/shaderc.h")) {
            New-Item -ItemType Directory -Force "$deps/include", "$deps/lib", "$deps/bin" | Out-Null
            Copy-Item "$sdk/Include/shaderc" "$deps/include" -Recurse -Force
            Copy-Item "$sdk/Lib/shaderc_shared.lib" "$deps/lib" -Force
            Copy-Item "$sdk/Bin/shaderc_shared.dll" "$deps/bin" -Force
          } else {
            git init shaderc-src
            git -C shaderc-src remote add origin https://github.com/google/shaderc.git
            git -C shaderc-src fetch --depth 1 origin 75137cca3b41a59b8b3e5c42177da8a9490c042f
            git -C shaderc-src checkout --detach FETCH_HEAD
            python shaderc-src/utils/git-sync-deps
            cmake -S shaderc-src -B shaderc-build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$deps" -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DSHADERC_ENABLE_SHARED_CRT=ON
            cmake --build shaderc-build --config Release --parallel 4
            cmake --install shaderc-build --config Release
          }
          foreach ($required in @('include/shaderc/shaderc.h','lib/shaderc_shared.lib','bin/shaderc_shared.dll')) {
            if (-not (Test-Path "$deps/$required")) { throw "Missing shaderc dependency: $required" }
          }

      - name: Make build directory
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

      - name: Use CMake 3.31 for legacy dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip'
          Invoke-WebRequest -Uri $url -OutFile cmake-3.31.6.zip -MaximumRetryCount 3
          Expand-Archive cmake-3.31.6.zip -DestinationPath "$env:RUNNER_TEMP/cmake-legacy" -Force
          $bin = Join-Path $env:RUNNER_TEMP 'cmake-legacy/cmake-3.31.6-windows-x86_64/bin'
          & "$bin/cmake.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake setup failed' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Fetch official NVIDIA NGX SDK (pinned)
        run: |
          git init ngx-sdk
          git -C ngx-sdk remote add origin https://github.com/NVIDIA/DLSS.git
          git -C ngx-sdk fetch --depth 1 origin 9981c6350dc58c0ce21f024fd65e31e851c31689
          git -C ngx-sdk checkout --detach FETCH_HEAD
          if (-not (Test-Path "ngx-sdk/lib/Windows_x86_64/x64/nvsdk_ngx_d.lib")) { throw "Official NGX library missing" }

      - name: Test adaptive upscaling controller
        shell: pwsh
        run: |
          clang-cl /std:c++17 /EHsc /Igui/include test/native_upscale_governor.cpp /Fe:native-upscale-test.exe
          ./native-upscale-test.exe

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_NATIVE_NGX_SDK="${{ github.workspace }}\ngx-sdk" `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir chiaki-ng-Win
          cp build\gui\chiaki.exe chiaki-ng-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll chiaki-ng-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libcrypto-*-x64.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libssl-*-x64.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\hidapi.dll" chiaki-ng-Win
          if (Test-Path "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\fftw3.dll") { cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\fftw3.dll" chiaki-ng-Win }
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\opus.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libspeexdsp.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\lcms2.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\miniupnpc.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\json-c.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" chiaki-ng-Win
          cp ngx-sdk\LICENSE.txt chiaki-ng-Win\NVIDIA-NGX-LICENSE.txt
          cp REMOTEPLAY-RTX.md chiaki-ng-Win\REMOTEPLAY-RTX.md
          cp scripts\remoteplay-safe-mode.cmd chiaki-ng-Win\SafeMode.cmd
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release chiaki-ng-Win\chiaki.exe

      - name: Package chiaki-ng
        run: |
          $CHIAKI_VERSION_MAJOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_MINOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MINOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_PATCH = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_PATCH ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $RELEASE_PACKAGE_FILE = "chiaki-ng-win_x64-VC-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          Compress-Archive chiaki-ng-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemotePlay-Native-RTX-Windows-x64-portable
          path: chiaki-ng-Win/
          if-no-files-found: error
          retention-days: 7

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemotePlay-Native-RTX-Windows-x64-installer
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 7
