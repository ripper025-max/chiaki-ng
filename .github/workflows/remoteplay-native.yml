name: Build RemotePlay Native Windows

on:
  push:
    branches: [remoteplay-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows_x64-msys2:
    name: Build windows msys2 version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            
      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libbplacebo
        run: |
          scripts/build-libplacebo-windows.sh
        env:
          LIBPLACEBO_VERSION: 3be579e6c7f6b421d9ac3ab4860edc437c50b3eb

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Test adaptive upscaling controller
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Igui/include test/native_upscale_governor.cpp -o native-upscale-test.exe
          ./native-upscale-test.exe

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki
          
      - name: Deploy chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Include diagnostic safe mode
        run: |
          cp scripts/remoteplay-safe-mode.cmd chiaki-ng-Win/SafeMode.cmd

      - name: Check packaged executable initialization
        shell: pwsh
        run: |
          $env:SDL_AUDIODRIVER = "dummy"
          $env:REMOTEPLAY_DIAGNOSTIC_LOG = "1"
          $exe = Join-Path (Get-Location) "chiaki-ng-Win/chiaki.exe"
          $p = Start-Process -FilePath $exe -ArgumentList @("--profile", "ci-smoke", "list") -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Packaged executable initialization timed out" }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "Packaged executable exited with code $($p.ExitCode)" }
          if (!(Test-Path "$env:TEMP/RemotePlayNative-startup-log.txt")) { throw "Qt startup log missing" }
          Get-Content "$env:TEMP/RemotePlayNative-startup-log.txt"

      - name: Package chiaki-ng
        run: |
          CHIAKI_VERSION_MAJOR="$(grep 'CHIAKI_VERSION_MAJOR' CMakeLists.txt | grep -Eo '[0-9]+')"
          CHIAKI_VERSION_MINOR="$(grep 'CHIAKI_VERSION_MINOR' CMakeLists.txt | grep -Eo '[0-9]+')"
          CHIAKI_VERSION_PATCH="$(grep 'CHIAKI_VERSION_PATCH' CMakeLists.txt | grep -Eo '[0-9]+')"
          RELEASE_PACKAGE_FILE="chiaki-ng-win_x64-MSYS2-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          zip -r $RELEASE_PACKAGE_FILE chiaki-ng-Win
          echo "RELEASE_PACKAGE_PATH=${RELEASE_PACKAGE_FILE}" >> $GITHUB_ENV

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemotePlay-Native-AI-Windows-x64-portable
          path: chiaki-ng-Win/
          if-no-files-found: error
          retention-days: 30

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemotePlay-Native-AI-Windows-x64-installer
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 30
          
